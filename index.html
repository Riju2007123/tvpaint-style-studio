<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>my-version — TVPaint-style studio</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; height: 100vh; overflow: hidden;
    font: 12px/1.35 "Segoe UI", sans-serif; background: #1e2023; color: #b9bfc6; }
  #app { display: grid; height: 100vh; grid-template-rows: 24px 32px 1fr 320px 26px; }

  /* ---- menu bar ---- */
  #menubar { background: #2a2e33; display: flex; align-items: stretch; padding: 0 4px;
    border-bottom: 1px solid #2B2B30; position: relative; }
  .menu-t { padding: 4px 10px; cursor: default; position: relative; }
  .menu-t:hover, .menu-t.open { background: #3d5666; }
  .menu-dd { position: absolute; top: 100%; left: 0; min-width: 230px; z-index: 50;
    background: #2f3237; border: 1px solid #2D2D32; border-radius: 4px;
    box-shadow: 0 8px 24px #0009; padding: 3px; display: none; }
  .menu-t.open .menu-dd { display: block; }
  .menu-dd .mi { padding: 4px 16px; cursor: pointer; white-space: nowrap; }
  .menu-dd .mi:hover { background: #3d5666; }
  .menu-dd .msep { height: 1px; background: #2D2D32; margin: 3px 6px; }
  .menu-dd .mdis { color: #6E6E75; cursor: default; }
  .menu-dd .mdis:hover { background: none; }

  /* ---- tool toolbar row ---- */
  #toolbar { background: #313136; display: flex; align-items: center; gap: 1px;
    padding: 0 6px; border-bottom: 1px solid #2B2B30; }
  .sep { width: 1px; height: 20px; background: #43484e; margin: 0 5px; }
  .tib { width: 26px; height: 26px; border: 0; background: none; border-radius: 4px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .tib img { width: 20px; height: 20px; }
  .tib:hover { background: #3d4249; }
  .tib.on { background: #3d5666; }
  #projTab { background: #40454c; color: #B6B6B6; border-radius: 3px; padding: 3px 26px 3px 10px;
    position: relative; margin-left: 12px; font-size: 12px; }
  #projTab button { position: absolute; right: 4px; top: 3px; background: none; border: 0;
    color: #898989; cursor: pointer; }
  #purchase { border: 1.5px solid #b7bec7; color: #B6B6B6; font-weight: 700;
    background: #313136; border-radius: 3px; padding: 2px 12px; margin: 0 12px;
    letter-spacing: .06em; cursor: pointer; }

  /* ---- work area ---- */
  #workarea { display: grid; grid-template-columns: 252px 1fr; min-height: 0; }
  #panels { background: #313136; border-right: 1px solid #2B2B30; overflow-y: auto;
    display: flex; flex-direction: column; }
  .panel { border-bottom: 1px solid #2B2B30; display: flex; flex-direction: column; }
  .phead { background: #34383d; display: flex; align-items: center; gap: 6px;
    padding: 2px 6px; border-bottom: 1px solid #2B2B30; }
  .phead .pt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #B6B6B6; }
  .pw { background: none; border: 0; color: #898989; cursor: pointer; width: 16px;
    padding: 0; font-size: 10px; }
  .pw:hover { color: #B6B6B6; }
  .pbody { padding: 6px; overflow: hidden; }

  .toolgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .toolgrid.g6 { grid-template-columns: repeat(6, 1fr); }
  .tbtn { background: #313136; border: 1px solid #2B2B30; border-radius: 3px; padding: 3px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .tbtn img { width: 20px; height: 20px; }
  .tbtn:hover { background: #3d4249; }
  .tbtn.on { background: #3d5666; border-color: #6fa8c9; }
  .tbtn.dis { opacity: .3; }

  .orow { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .orow label { flex: 0 0 112px; color: #aab1b8; }
  .orow input[type=number], .orow select, .orow input[type=text] {
    background: #2D2D32; color: #B6B6B6; border: 1px solid #2B2B30; border-radius: 3px;
    padding: 2px 4px; width: 86px; flex: none; }
  .orow .badge { background: #3E476B; border-radius: 2px; padding: 0 3px; color: #9fe0ff;
    font-size: 10px; }
  .orow input[type=checkbox] { margin-left: auto; }
  .revbtn { background: #3E476B; border: 1px solid #2B2B30; border-radius: 3px;
    color: #B6B6B6; padding: 3px 14px; cursor: pointer; }
  .revbtn:hover { background: #454b52; }
  /* per-layer playback control (REA: ✓ None / Loop / Ping-Pong / Hold) */
  .pbBtn { background: #2D2D32; color: #B6B6B6; border: 1px solid #2B2B30; border-radius: 3px;
    font-size: 9px; line-height: 14px; padding: 0 3px; height: 16px; cursor: pointer; flex: none; }
  .pbBtn:hover { background: #3E476B; }
  .pbmenu { position: fixed; z-index: 400; background: #313136; border: 1px solid #5A5A61;
    box-shadow: 0 3px 10px #000a; padding: 2px 0; min-width: 92px; color: #B6B6B6; font-size: 11px; }
  .pbmenu .pbhead { padding: 3px 8px; color: #d0d0d4; font-weight: 600; font-size: 11px;
    border-bottom: 1px solid #4a4a51; margin-bottom: 2px; }
  .pbmenu .pbi { padding: 3px 8px; cursor: pointer; white-space: nowrap; display: flex; gap: 6px; }
  .pbmenu .pbi:hover { background: #3E476B; }
  .pbmenu .pbi .chk { width: 10px; display: inline-block; }
  /* Increase Layer Length dialog */
  .llmodes { display: flex; flex-direction: column; gap: 3px; margin: 2px 0 6px; }
  .llmode { display: flex; align-items: center; gap: 6px; background: #3E476B; border: 1px solid #2B2B30;
    border-radius: 3px; padding: 3px 8px; cursor: pointer; }
  .llmode:hover { background: #454b52; }
  .llmode.dis { color: #6E6E75; background: #33333a; cursor: default; }
  .llopt { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .llopt input[type=checkbox] { margin: 0; }
  .tabs { display: flex; gap: 2px; margin: 4px 0; }
  .tabs .tab { background: #313136; border: 1px solid #2B2B30; border-bottom: 0;
    border-radius: 4px 4px 0 0; padding: 3px 14px; cursor: pointer; }
  .tabs .tab.on { background: #3E476B; color: #B6B6B6; }

  #cwrap { display: grid; grid-template-rows: 1fr 22px; min-height: 0; min-width: 0; }
  #viewport { position: relative; background: #313136; overflow: hidden; min-width: 0; }
  #art, #ovl { position: absolute; left: 0; top: 0; }
  #ovl { touch-action: none; cursor: crosshair; }
  #vbRow { background: #313136; border-top: 1px solid #2B2B30; display: flex;
    align-items: center; gap: 8px; padding: 0 8px; overflow: hidden; }
  #canvasScroll { flex: 1; height: 6px; background: #232327; border-radius: 3px; position: relative;
    overflow: hidden; margin-right: 20px; }
  #canvasScrollThumb { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: #55555c;
    border-radius: 3px; }
  #vbRight { display: flex; align-items: center; gap: 6px; color: #898989; font-size: 11px; }
  #vbRight .vbrot { color: #8a8a90; font-size: 13px; }
  #vbRight #zoomLbl { min-width: 44px; text-align: right; }
  #vbRow .tib { width: 24px; height: 22px; }
  #ovBar { height: 10px; background: #232327; border-radius: 5px; position: relative; overflow: hidden;
    flex: 1 1 auto; min-width: 80px; margin: 0 6px; border: 1px solid #2B2B30; }
  #ovFill { position: absolute; top: 0; bottom: 0; background: #3E476B; }
  #ovIn, #ovOut, #ovMark { position: absolute; top: 0; bottom: 0; width: 2px; }
  #ovIn { background: #3f7a3f; } #ovOut { background: #8a3f3f; } #ovMark { background: #F0D092; }
  #vbRow .tib { width: 24px; height: 22px; }
  #dispSel { width: 84px; background: #2D2D32; color: #B6B6B6; border: 1px solid #2B2B30;
    border-radius: 3px; padding: 2px 4px; }
  #zoomIn, #zoomOut { width: 16px; height: 16px; }
  #zoomLbl { min-width: 44px; text-align: left; color: #aab1b8; }

  /* ---- timeline panel (verified pixel-by-pixel against TVPaint 12.1.0 Pro Demo) ---- */
  #tlpanel { background: #313136; border-top: 1px solid #2B2B30; display: flex;
    flex-direction: column; min-height: 0; }
  #tlTabsRow { display: flex; align-items: center; justify-content: center; background: #313136;
    border-bottom: 1px solid #2B2B30; padding: 0 8px; height: 20px; flex: none; }
  #tlInfoRow { text-align: center; color: #898989; font-size: 11px; margin: 0 auto;
    white-space: nowrap; overflow: hidden; padding: 0 2px; }
  #tlInfoRow span { margin: 0 13px; }
  /* 395 px left column = 355 px layer panel + 40 px separator column (⊘) */
  #tlBody { flex: 1; display: grid; grid-template-columns: 395px 1fr; min-height: 0; }
  #tlLeft { overflow: hidden; padding: 0; position: relative; background: #313136; }
  .lsep { position: absolute; right: 0; top: 0; bottom: 0; width: 50px; background: #2D2D32;
    border-left: 1px solid #2B2B30; z-index: 1; }
  .lsep::before { content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 10px;
    background: #3a3a41; border-left: 1px solid #4a4a51; border-right: 1px solid #26262b; }
  .lsep .pin { position: absolute; left: 26px; transform: translateX(-50%); top: 46px; height: 60px;
    display: flex; align-items: center; color: #7c8288; font-size: 15px; }
  .lhead { height: 29px; width: 345px; box-sizing: border-box; border-bottom: 1px solid #2B2B30;
    display: flex; flex-direction: row; align-items: center; gap: 5px; padding: 0 4px; overflow: hidden;
    position: relative; z-index: 2; }
  .lhead.withcam { height: 46px; }
  .ltabs { display: flex; align-items: center; gap: 2px; flex: none; }
  .ltabs .tab { background: #46464D; border-radius: 4px; padding: 2px 9px; cursor: pointer;
    color: #c6c6cc; font-size: 11px; white-space: nowrap; }
  .ltabs .tab.on { background: #3E476B; color: #dcdce6; }
  .lhiconsrow { height: 17px; width: 345px; box-sizing: border-box; display: flex; align-items: center;
    border-bottom: 1px solid #2B2B30; position: relative; z-index: 2; overflow: hidden; }
  .lhicons { display: flex; align-items: center; gap: 1px; height: 17px; flex: 1 1 auto;
    min-width: 0; padding: 0 3px; }
  .lhicons img.sq { width: 14px; height: 14px; display: block; filter: invert(.35); }
  .lhicons .vsep { width: 1px; height: 12px; background: #4a4a51; margin: 0 2px; }
  .lhicons .hbtn { background: none; border: 0; padding: 0; cursor: pointer; display: flex; }
  .lhicons .hbtn img { width: 15px; height: 15px; display: block; filter: invert(.35); }
  .lhicons .hbtn img[src*="DeleteLayer"] { filter: none; }
  .minib.newbtn { margin-left: 5px; display: flex; align-items: center; gap: 5px;
    background: #3a3a40; border: 1px solid #4a4a51; border-radius: 9px; color: #c8c8cc;
    font-size: 10px; padding: 0 4px 0 8px; cursor: pointer; height: 16px; }
  .minib.newbtn .arrow { width: 12px; height: 12px; border-radius: 50%; background: #55555c;
    color: #d0d0d4; font-size: 8px; display: flex; align-items: center; justify-content: center; }
  .lhicons .hsp { flex: 1 1 auto; }
  .lhicons .flag { background: none; border: 0; padding: 0; cursor: pointer; display: flex; }
  .lhicons .flag img { width: 14px; height: 14px; filter: invert(.85); }
  .lhicons .flag.off img { opacity: .4; }
  .llayer { height: 60px; width: 345px; box-sizing: border-box; border-bottom: 1px solid #2B2B30;
    display: flex; flex-direction: column; position: relative; z-index: 2; cursor: pointer; }
  .llayer .lrowbg { position: absolute; left: 27px; right: 0; top: 0; bottom: 0; background: #313136; z-index: 0; }
  .llayer.cur .lrowbg { background: #3C3C43; }
  .llayer .lname { height: 19px; display: flex; align-items: center; gap: 4px; padding: 0 3px 0 44px;
    position: relative; z-index: 1; }
  .llayer .lminus { color: #9a9aa0; font-size: 11px; line-height: 1; }
  .llayer .lname .nm { flex: 1; font-size: 12px; color: #b8b8be; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .llayer .lname .lmore { opacity: .7; display: flex; cursor: pointer; }
  .llayer .lname .lmore img { width: 13px; height: 13px; filter: invert(.35); }
  .llayer .lbody { flex: 1; display: grid; grid-template-columns: 53px 1fr 78px;
    grid-template-rows: 22px 19px; column-gap: 6px; align-items: start;
    padding: 0 8px 0 60px; position: relative; z-index: 1; }
  .llayer .ltype { position: absolute; left: 8px; top: 6px; width: 18px; height: 18px;
    opacity: .95; z-index: 2; filter: invert(.8); }
  .llayer .lthumb { grid-column: 1; grid-row: 1 / span 2; width: 52px; height: 26px; background: #fff;
    border: 1px solid #2B2B30; border-radius: 2px; margin-top: 0; }
  .llayer .lmid { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column;
    gap: 0; min-width: 0; padding-left: 0; }
  .llayer .lplay { display: flex; align-items: center; gap: 1px; height: 18px; }
  .llayer .lplay .dot { width: 5px; height: 5px; border-radius: 50%; background: #55555c; margin-right: 4px; }
  .llayer .lplay button { background: none; border: 0; padding: 0; cursor: pointer; opacity: .85; display: flex; }
  .llayer .lplay img { width: 16px; height: 16px; display: block; filter: invert(.75); }
  .llayer .lplay .looppb { margin-left: 3px; }
  .llayer .lplay .looppb img { width: 15px; height: 15px; filter: invert(.45); }
  .llayer .lcolor { font-size: 10px; color: #8f8f95; padding-left: 0; }
  .llayer .lflags { grid-column: 3; grid-row: 1; display: flex; align-items: flex-end; gap: 5px; height: 22px; }
  .llayer .lflags .flag { background: none; border: 0; padding: 0; cursor: pointer; display: flex; }
  .llayer .lflags img { width: 15px; height: 15px; filter: invert(.85); }
  .llayer .lflags .flag.off img { opacity: .4; }
  .llayer .dots { display: flex; gap: 6px; padding-bottom: 3px; }
  .llayer .dots i { width: 5px; height: 5px; border-radius: 50%; background: #5a5a61; display: block; }
  .llayer .lop { grid-column: 3; grid-row: 2; display: flex; align-items: center; gap: 3px; margin-top: 2px;
    background: #2D2D32; border: 1px solid #2B2B30; border-radius: 3px; height: 16px; padding: 0 3px; }
  .llayer .lop span { font-size: 10px; color: #9a9a9f; }
  .llayer .lop input[type=range] { flex: 1; height: 3px; min-width: 16px; -webkit-appearance: none;
    appearance: none; background: transparent; }
  .llayer .lop input[type=range]::-webkit-slider-runnable-track { height: 3px; background: #66666d;
    border-radius: 2px; }
  .llayer .lop input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px;
    margin-top: -2.5px; border-radius: 50%; background: #cfcfd4; }
  .llayer .lop .lval { font-size: 10px; color: #c8c8cc; }
  .camrow { height: 17px; padding: 0 6px; gap: 3px; flex: none; display: flex; align-items: center;
    background: #3C3C43; border-bottom: 1px solid #2B2B30; width: 345px; box-sizing: border-box; }
  .camrow .nm { flex: 1; font-size: 11px; }
  #tlTrack { overflow: auto; position: relative; display: flex; flex-direction: column;
    scrollbar-width: none; -ms-overflow-style: none; }
  #tlTrack::-webkit-scrollbar { width: 0; height: 0; }
  .ruler { display: flex; height: 17px; flex: none; background: #2D2D32; position: sticky; top: 0;
    z-index: 6; border-bottom: 1px solid #2B2B30; }
  .ruler.bot { border-bottom: 0; border-top: 1px solid #2B2B30; position: sticky; bottom: 0;
    top: auto; z-index: 6; }
  .ruler .tick { width: 40px; min-width: 40px; flex: none; font-size: 11px; color: #a4a4aa;
    position: relative; padding: 1px 0 0 4px; box-sizing: border-box; }
  .ruler .tick.cur { background: #3E476B; color: #fff; }
  .ruler .tick.in { color: #7fae7f; }
  .ruler .band { position: absolute; bottom: 0; height: 2px; background: #3d6fd9; pointer-events: none; }
  .ruler .band.green { background: #4f7a4a; }
  .ttopspacer { height: 29px; flex: none; }
  .tlspacer { flex: 1 0 auto; min-height: 0; }
  .strip { height: 60px; flex: none; display: flex; position: relative; background: #313136;
    border-bottom: 1px solid #2B2B30; box-sizing: border-box; }
  .strip.sel { background: #3C3C43; }
  .strip .cells { display: flex; height: 40px; flex: none; }
  .cell { width: 40px; min-width: 40px; flex: none; height: 40px; position: relative;
    cursor: pointer; background: transparent; border: 0; }
  .cell.keyw::before { content: ""; position: absolute; left: 0; top: 0; width: 40px; height: 40px;
    background: linear-gradient(#2B2B30, #3A3A3F 42%, #3A3A3F 58%, #2B2B30);
    box-shadow: inset 0 1px 0 #77777d; z-index: 0; }
  .cell .cellimg { position: absolute; left: 0; top: 9px; width: 40px; height: 22px;
    background: #fff; border-top: 1px solid #C9C9CE; border-bottom: 1px solid #C9C9CE;
    box-sizing: border-box; z-index: 2; }
  .cell .cellimg.empty { background: repeating-conic-gradient(#cfcfcf 0% 25%, #f2f2f2 0% 50%) 0 0 / 8px 8px; }
  .cell .cellimg canvas { display: block; width: 40px; height: 22px; }
  .cell.hold::after { content: ""; position: absolute; left: 50%; top: 20px; width: 16px; height: 2px;
    transform: translate(-50%, -50%); background: #6a6a70; z-index: 1; }
  .cell .knum { position: absolute; left: 2px; top: 40px; font-size: 10px; color: #b0b0b6; z-index: 3; }
  .cell .empin { position: absolute; left: 50%; top: 20px; transform: translate(-50%, -50%);
    color: #8a8a90; font-size: 15px; z-index: 2; }
  .cell .plus { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 16px; height: 14px;
    z-index: 5; color: #a7d3a7; background: none; border: 0; font-size: 12px; cursor: pointer; display: none; }
  .strip:hover .cell .plus { display: block; }
  .cell .dh { position: absolute; top: 1px; width: 7px; height: 7px; background: #6a6a70;
    z-index: 4; cursor: ew-resize; touch-action: none; }
  .cell .dh.l { left: 1px; }
  .cell .dh.r { right: 1px; }
  .cell .dh.grab { background: #5A66CC; }
  .expLine { position: absolute; top: 1px; height: 1px; background: #9a9aa0; z-index: 3; pointer-events: none; }
  .expLine .knob { position: absolute; top: -3px; width: 7px; height: 7px; background: #6a6a70; }
  .expHandle { position: absolute; top: 0; width: 9px; height: 40px; cursor: ew-resize; z-index: 6; touch-action: none; }
  .expHandle::after { content: ""; position: absolute; left: 1px; top: 1px; width: 7px; height: 7px; background: #6a6a70; }
  .blkExp, .blkFrame { display: none; }
  /* red current-image bounds, full track height (verified #CB0B0C in the real app) */
  #curCol { position: absolute; top: 29px; bottom: 0; width: 40px; z-index: 5; pointer-events: none;
    border-left: 1px solid #c0403f; border-right: 1px solid #c0403f; background: transparent; }
  #curCol::before { display: none; }
  /* ---- transport: two-line Mark In / overview bar + remote icons / two-line Mark Out ---- */
  #tlTransport { display: flex; align-items: stretch; height: 64px; flex: none;
    background: linear-gradient(#2D2D32 0 25px, #313136 25px 46px, #2D2D32 46px 100%);
    border-bottom: 1px solid #2B2B30; }
  .tr-spacer { width: 208px; flex: none; }
  .tr-mark { width: 94px; flex: none; position: relative; }
  .tr-mark .lbl { position: absolute; left: 0; right: 0; top: 23px; height: 12px; color: #898989;
    font-size: 10px; display: flex; align-items: center; gap: 5px; white-space: nowrap; padding-left: 4px; }
  .tr-mark.right { width: 84px; margin-right: 21px; }
  .tr-mark.right .lbl { justify-content: flex-end; padding: 0 4px 0 0; }
  .tr-mark .mk { color: #9a9a9f; font-size: 11px; }
  .tr-mark input { position: absolute; left: 0; top: 47px; width: 94px; height: 16px; background: #46464D;
    color: #c8c8cc; border: 0; border-radius: 1px; padding: 0 5px; font-size: 10px; box-sizing: border-box; }
  .tr-mark.right input { left: auto; right: 0; width: 84px; }
  .tr-center { flex: 1; position: relative; min-width: 0; margin: 0 6px 0 9px; }
  .tr-scroll { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 40%;
    height: 9px; background: transparent; z-index: 3; }
  #tsThumb { width: 100%; height: 9px; background: #46464D; cursor: grab; }
  #tsThumb.drag { cursor: grabbing; }
  .tr-center #ovBar { position: absolute; left: 0; right: 0; top: 47px; height: 16px; border-radius: 0;
    background: #2D2D32; border: 0; margin: 0; overflow: hidden; width: auto; }
  #ovFill { display: none; }
  #ovCur { position: absolute; top: 0; height: 13px; background: #3E476B; }
  #ovIn { position: absolute; left: 0; bottom: 0; width: 3px; height: 4px; background: #2E7550; }
  #ovOut { position: absolute; left: 0; bottom: 0; width: 3px; height: 4px; background: #6E3550; }
  #ovNum { position: absolute; top: 0; height: 13px; line-height: 13px; color: #6b7390;
    font-size: 12px; pointer-events: none; }
  .tr-center #ovBar .ovt { position: absolute; bottom: 0; width: 1px; height: 9px;
    background: #000; pointer-events: none; }
  .tr-center #ovBar .ovticks { display: none; }
  .tr-btns { position: absolute; left: 0; right: 0; top: 23px; display: flex; align-items: center;
    justify-content: center; gap: 7px; }
  .tr-btns .tib { width: 22px; height: 22px; padding: 0; }
  .tr-btns .tib img { width: 18px; height: 18px; display: block; filter: invert(.32) brightness(1.05); }
  .fpswrap { position: relative; display: inline-flex; align-items: center; flex: none; }
