<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>my-version — TVPaint-style studio</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; height: 100vh; overflow: hidden;
    font: 12px/1.35 "Segoe UI", sans-serif; background: #1e2023; color: #b9bfc6; }
  #app { display: grid; height: 100vh; grid-template-rows: 24px 32px 1fr 236px 22px; }

  /* ---- menu bar ---- */
  #menubar { background: #2a2e33; display: flex; align-items: stretch; padding: 0 4px;
    border-bottom: 1px solid #2B2B30; position: relative; }
  .menu-t { padding: 4px 10px; cursor: default; position: relative; }
  .menu-t:hover, .menu-t.open { background: #3d5666; }
  .menu-dd { position: absolute; top: 100%; left: 0; min-width: 230px; z-index: 50;
    background: #2f3237; border: 1px solid #2D2D32; border-radius: 4px;
    box-shadow: 0 8px 24px #0009; padding: 3px; display: none; }
  .menu-t.open .menu-dd { display: block; }
  .menu-dd .mi { padding: 4px 16px; cursor: pointer; white-space: nowrap; }
  .menu-dd .mi:hover { background: #3d5666; }
  .menu-dd .msep { height: 1px; background: #2D2D32; margin: 3px 6px; }
  .menu-dd .mdis { color: #6E6E75; cursor: default; }
  .menu-dd .mdis:hover { background: none; }

  /* ---- tool toolbar row ---- */
  #toolbar { background: #313136; display: flex; align-items: center; gap: 1px;
    padding: 0 6px; border-bottom: 1px solid #2B2B30; }
  .sep { width: 1px; height: 20px; background: #43484e; margin: 0 5px; }
  .tib { width: 26px; height: 26px; border: 0; background: none; border-radius: 4px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .tib img { width: 20px; height: 20px; }
  .tib:hover { background: #3d4249; }
  .tib.on { background: #3d5666; }
  #projTab { background: #40454c; color: #B6B6B6; border-radius: 3px; padding: 3px 26px 3px 10px;
    position: relative; margin-left: 12px; font-size: 12px; }
  #projTab button { position: absolute; right: 4px; top: 3px; background: none; border: 0;
    color: #898989; cursor: pointer; }
  #purchase { border: 1.5px solid #b7bec7; color: #B6B6B6; font-weight: 700;
    background: #313136; border-radius: 3px; padding: 2px 12px; margin: 0 12px;
    letter-spacing: .06em; cursor: pointer; }

  /* ---- work area ---- */
  #workarea { display: grid; grid-template-columns: 252px 1fr; min-height: 0; }
  #panels { background: #313136; border-right: 1px solid #2B2B30; overflow-y: auto;
    display: flex; flex-direction: column; }
  .panel { border-bottom: 1px solid #2B2B30; display: flex; flex-direction: column; }
  .phead { background: #34383d; display: flex; align-items: center; gap: 6px;
    padding: 2px 6px; border-bottom: 1px solid #2B2B30; }
  .phead .pt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #B6B6B6; }
  .pw { background: none; border: 0; color: #898989; cursor: pointer; width: 16px;
    padding: 0; font-size: 10px; }
  .pw:hover { color: #B6B6B6; }
  .pbody { padding: 6px; overflow: hidden; }

  .toolgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .toolgrid.g6 { grid-template-columns: repeat(6, 1fr); }
  .tbtn { background: #313136; border: 1px solid #2B2B30; border-radius: 3px; padding: 3px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .tbtn img { width: 20px; height: 20px; }
  .tbtn:hover { background: #3d4249; }
  .tbtn.on { background: #3d5666; border-color: #6fa8c9; }
  .tbtn.dis { opacity: .3; }

  .orow { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .orow label { flex: 0 0 112px; color: #aab1b8; }
  .orow input[type=number], .orow select, .orow input[type=text] {
    background: #2D2D32; color: #B6B6B6; border: 1px solid #2B2B30; border-radius: 3px;
    padding: 2px 4px; width: 86px; flex: none; }
  .orow .badge { background: #3E476B; border-radius: 2px; padding: 0 3px; color: #9fe0ff;
    font-size: 10px; }
  .orow input[type=checkbox] { margin-left: auto; }
  .revbtn { background: #3E476B; border: 1px solid #2B2B30; border-radius: 3px;
    color: #B6B6B6; padding: 3px 14px; cursor: pointer; }
  .revbtn:hover { background: #454b52; }
  /* per-layer playback control (REA: ✓ None / Loop / Ping-Pong / Hold) */
  .pbBtn { background: #2D2D32; color: #B6B6B6; border: 1px solid #2B2B30; border-radius: 3px;
    font-size: 9px; line-height: 14px; padding: 0 3px; height: 16px; cursor: pointer; flex: none; }
  .pbBtn:hover { background: #3E476B; }
  .pbmenu { position: fixed; z-index: 400; background: #313136; border: 1px solid #5A5A61;
    box-shadow: 0 3px 10px #000a; padding: 2px 0; min-width: 92px; color: #B6B6B6; font-size: 11px; }
  .pbmenu .pbi { padding: 3px 8px; cursor: pointer; white-space: nowrap; display: flex; gap: 6px; }
  .pbmenu .pbi:hover { background: #3E476B; }
  .pbmenu .pbi .chk { width: 10px; display: inline-block; }
  /* Increase Layer Length dialog */
  .llmodes { display: flex; flex-direction: column; gap: 3px; margin: 2px 0 6px; }
  .llmode { display: flex; align-items: center; gap: 6px; background: #3E476B; border: 1px solid #2B2B30;
    border-radius: 3px; padding: 3px 8px; cursor: pointer; }
  .llmode:hover { background: #454b52; }
  .llmode.dis { color: #6E6E75; background: #33333a; cursor: default; }
  .llopt { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .llopt input[type=checkbox] { margin: 0; }
  .tabs { display: flex; gap: 2px; margin: 4px 0; }
  .tabs .tab { background: #313136; border: 1px solid #2B2B30; border-bottom: 0;
    border-radius: 4px 4px 0 0; padding: 3px 14px; cursor: pointer; }
  .tabs .tab.on { background: #3E476B; color: #B6B6B6; }

  #cwrap { display: grid; grid-template-rows: 1fr 30px; min-height: 0; min-width: 0; }
  #viewport { position: relative; background: #313136; overflow: hidden; min-width: 0; }
  #art, #ovl { position: absolute; left: 0; top: 0; }
  #ovl { touch-action: none; cursor: crosshair; }
  #vbRow { background: #313136; border-top: 1px solid #2B2B30; display: flex;
    align-items: center; gap: 4px; padding: 0 8px; overflow: hidden; }
  #vbRow .tib { width: 24px; height: 22px; }
  #ovBar { height: 10px; background: #232327; border-radius: 5px; position: relative; overflow: hidden;
    flex: 1 1 auto; min-width: 80px; margin: 0 6px; border: 1px solid #2B2B30; }
  #ovFill { position: absolute; top: 0; bottom: 0; background: #3E476B; }
  #ovIn, #ovOut, #ovMark { position: absolute; top: 0; bottom: 0; width: 2px; }
  #ovIn { background: #3f7a3f; } #ovOut { background: #8a3f3f; } #ovMark { background: #F0D092; }
  /* hold cells: dark cell with ONE horizontal dash (TVPaint exposure hold look) */
  .cell.hold { background: #2D2D32; }
  .cell.hold::after { content: ""; position: absolute; left: 50%; top: 50%; width: 55%; height: 2px;
    transform: translate(-50%, -50%); background: #4a4a51; }
  .strip .cell { background: #2D2D32; }
  .cell.keyw { background: #efefef; }
  #vbRow .tib { width: 24px; height: 22px; }
  #dispSel { width: 84px; background: #2D2D32; color: #B6B6B6; border: 1px solid #2B2B30;
    border-radius: 3px; padding: 2px 4px; }
  #zoomIn, #zoomOut { width: 16px; height: 16px; }
  #zoomLbl { min-width: 44px; text-align: left; color: #aab1b8; }

  /* ---- timeline panel ---- */
  #tlpanel { background: #313136; border-top: 1px solid #2B2B30; display: flex;
    flex-direction: column; min-height: 0; }
  #tlTabsRow { display: flex; align-items: flex-end; background: #2D2D32;
    border-bottom: 1px solid #2B2B30; padding: 2px 6px 0; min-height: 22px; }
  #tlTabs { display: flex; align-items: flex-end; gap: 2px; background: transparent; padding: 0; flex: none; }
  #tlTabs .tab { background: #313136; border: 1px solid #2B2B30; border-bottom: 0;
    border-radius: 4px 4px 0 0; padding: 2px 16px; cursor: pointer; color: #898989; font-size: 11px; }
  #tlTabs .tab.on { background: #3E476B; color: #B6B6B6; }
  #tlBody { flex: 1; display: grid; grid-template-columns: 252px 1fr; min-height: 0; }
  #tlLeft { border-right: 1px solid #2B2B30; overflow: hidden; padding: 0; }
  /* left column mirrors the track row-for-row (verified against the reference screenshot):
     .lhead = ruler(20) + camera strip(20); .llayer = strip(40) + label margin(15) + border */
  .lhead { height: 20px; box-sizing: border-box; border-bottom: 1px solid #2B2B30;
    display: flex; flex-direction: column; justify-content: flex-start; gap: 0;
    padding: 0 5px; overflow: hidden; }
  .lhead.withcam { height: 40px; }
  .lhicons { display: flex; align-items: center; gap: 3px; height: 19px; flex: none; }
  .lhicons img.sq { width: 16px; height: 16px; }
  .camrow { height: 20px; padding: 0; gap: 3px; flex: none; }
  .llayer { height: 56px; border-bottom: 1px solid #2B2B30; display: flex; flex-direction: column; }
  .llayer .lname { height: 20px; }
  .llayer .lblock { flex: 1; display: flex; gap: 5px; padding: 1px 5px 2px; align-items: flex-start; }
  .llayer .lblock .lthumb { width: 34px; height: 20px; background: #fff; border: 1px solid #2B2B30;
    border-radius: 2px; flex: none; }
  .llayer .lblock .lcol { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .llayer .lblock .minic { font-size: 9px; color: #898989; white-space: nowrap; }
  .llayer .lblock .oprow { display: flex; align-items: center; gap: 3px; color: #898989; }
  .llayer .lblock .oprow input[type=range] { flex: 1; height: 6px; }
  .trow { display: flex; align-items: center; gap: 4px; padding: 1px 6px; height: 30px; }
  .trow.cur { background: #333a41; }
  .trow.dim { opacity: .45; }
  .trow.locked { opacity: .6; }
  .trow canvas { width: 48px; height: 24px; background: #fff; border: 1px solid #2D2D32;
    border-radius: 2px; flex: none; }
  .trow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lhead .camrow { height: 20px; padding: 0 0; }
  .lhead .camrow .nm { font-size: 11px; }
  .trow .sq { opacity: .5; width: 16px; height: 16px; }
  .sf { background: none; border: 0; padding: 0 1px; cursor: pointer; opacity: .3; }
  .sf img { width: 15px; height: 15px; display: block; }
  .sf.on { opacity: 1; }
  #tlTrack { overflow: auto; position: relative; }
  .ruler { display: flex; position: sticky; left: 0; height: 20px; background: transparent;
    z-index: 5; border-bottom: 1px solid #2B2B30; }
  .ruler .tick { position: relative; z-index: 6; }
  .ruler.bot { border-bottom: 0; border-top: 1px solid #2B2B30; margin-top: -1px; }
  .ruler .tick { width: 80px; min-width: 80px; flex: none; border-left: 0; padding: 2px 0 2px 4px;
    font-size: 10px; color: #898989; position: relative; }
  .ruler .tick.in { color: #3f7a3f; }
  .ruler .tick.cur { background: #3d6fd9; color: #fff; }
  .ruler .band { position: absolute; top: 0; height: 4px; background: #3d6fd9; }
  .ruler .band.green { background: #4f7a4a; }
  .strip { display: flex; height: 40px; border-bottom: 1px solid #2B2B30; position: relative; }
  .cell { width: 40px; min-width: 40px; flex: none; border-right: 1px solid #2B2B30; position: relative;
    cursor: pointer; background: #2D2D32; }
  .cell.keyw { background: #efefef; }
  .cell.hold { background: #efefef; }
  .cell.blockend::after { content: attr(data-exp); position: absolute; right: 2px; top: 2px;
    background: #2D2D32; color: #B6B6B6; font-size: 10px; padding: 0 4px; border-radius: 2px; }
  .cell .pin { position: absolute; right: -7px; top: 12px; width: 14px; height: 14px; z-index: 3;
    font-size: 12px; color: #898989; }
  .cell .kdot { position: absolute; left: 2px; top: 1px; font-size: 9px; color: #333; }
  .cell .plus { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); width: 18px; height: 14px;
    z-index: 3; color: #a7d3a7; background: none; border: 0; font-size: 12px; cursor: pointer;
    display: none; }
  .strip:hover .cell:not(:first-child) .plus { display: block; }
  .cell.playhead::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; background: #ffd24a; z-index: 2; }
  .cell.curf { outline: 1px solid #6fa8c9; }
  .tlfoot { display: flex; align-items: center; gap: 4px; background: #313136;
    border-top: 1px solid #2B2B30; padding: 2px 6px; }
  .tlfoot .ftab { background: #313136; border: 1px solid #2B2B30; border-radius: 3px;
    padding: 2px 12px; cursor: pointer; color: #898989; font-size: 11px; }
  .tlfoot .ftab.on { background: #3E476B; color: #B6B6B6; }
  .blockend::after { display: none; }
  /* animation cell block: one rounded container per drawing (key .. key+exposure-1) */
  .strip { margin-bottom: 15px; }
  .strip .pin { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    color: #71767c; font-size: 11px; }
  .strip .pin:first-child { left: -2px; }
  .strip .pin:last-child { left: auto; right: -4px; }
  .blk { position: absolute; top: 0; bottom: 0; border: 1px solid #5A5A61; border-radius: 6px;
    background: rgba(140, 150, 160, 0.07); pointer-events: none; z-index: 1; }
  .blk .knob { position: absolute; top: -5px; left: -5px; width: 9px; height: 9px;
    border-radius: 50%; background: #5A5A61; border: 1px solid #313136; }
  .blk.grabbed { border-color: #5A66CC; }
  .blk.grabbed .knob { background: #5A66CC; }
  .blkExp { position: absolute; right: 2px; top: -1px; background: #2D2D32; color: #B6B6B6;
    font-size: 10px; font-style: normal; padding: 0 5px; border-radius: 3px; z-index: 2; }
  .blkFrame { position: absolute; left: 3px; top: -1px; color: #898989; font-size: 10px;
    font-style: normal; z-index: 2; }
  /* empty drawing = checkerboard cell (white = ink present, like TVPaint) */
  .cell.empty { background: repeating-conic-gradient(#cfcfcf 0% 25%, #f2f2f2 0% 50%) 0 0 / 8px 8px; }
  /* drawing number label BELOW the strip */
  .knum { position: absolute; bottom: -13px; left: 1px; font-size: 9px; color: #B6B6B6; z-index: 2; }
  .cell .kdot { display: none; }
  .cell .vsigil { position: absolute; left: 1px; top: 50%; transform: translateY(-50%);
    color: #B6B6B6; font-size: 9px; background: rgba(0, 0, 0, 0.3); border-radius: 50%;
    width: 12px; height: 12px; line-height: 12px; text-align: center; z-index: 2; }
  /* red current-image line: full track height (through both rulers) */
  #curLine { position: absolute; top: 0; bottom: 0; width: 2px; background: #c05555;
    z-index: 5; pointer-events: none; }
  /* blue current-frame column through the whole track, red edges mark the image bounds */
  #curCol { position: absolute; top: 0; bottom: 0; width: 40px; z-index: 4; pointer-events: none;
    background: rgba(61, 111, 217, 0.55); border-left: 1px solid #c05555; border-right: 1px solid #c05555; }
  #curCol::before { content: ""; position: absolute; inset: 0;
    background: rgba(61, 111, 217, 0.35); }
  /* exposure end handle at the last drawing block: drag to increase the length */
  .expHandle { position: absolute; right: -2px; top: 0; bottom: 0; width: 8px; cursor: ew-resize;
    z-index: 6; touch-action: none; }
  .expHandle::after { content: ""; position: absolute; right: 3px; top: 4px; bottom: 4px;
    width: 2px; background: #b8bdc2; }
  /* timing handles: small gray squares at the top corners of every key cell */
  .cell .dh { position: absolute; top: -2px; width: 7px; height: 7px; background: #5A5A61;
    z-index: 4; cursor: ew-resize; touch-action: none; }
  .cell .dh.l { left: 1px; }
  .cell .dh.r { right: 1px; }
  .cell .dh.grab { background: #5A66CC; }
  /* add-drawing + at the left edge of each strip */
  .plus.stripstart { position: absolute; display: block; right: auto; left: -10px; top: -7px; }
  /* transport row above the ruler (REA: Mark In / fps / play / zoom / Mark Out) */
  #tlTransport { display: flex; align-items: center; gap: 6px; background: #313136;
    border-bottom: 1px solid #2B2B30; padding: 3px 8px; min-height: 30px; }
  #tlTransport .tbtn { background: none; border: 0; color: #B6B6B6; cursor: pointer;
    font-size: 13px; padding: 1px 4px; }
  #tlTransport .tbtn.ton { color: #9fe08f; }
  #tlTransport .tinput { background: #2D2D32; color: #B6B6B6; border: 1px solid #2B2B30;
    border-radius: 3px; font-size: 11px; padding: 2px 5px; width: 46px; }
  #tlTransport .tlbl { color: #898989; font-size: 11px; }
  #tlInfoRow { text-align: right; color: #898989; font-size: 11px; padding: 0 2px 2px;
    background: transparent; margin-left: auto; white-space: nowrap; overflow: hidden; }
  #tlInfoRow span { margin-left: 16px; }
  /* camera layer strip: thin row with always-visible + inserts */
  .strip.cam { height: 20px; }
  .strip.cam .cell { background: #2D2D32; }
  .plus.always { display: block; top: -7px; }
  /* blue selected layer row */
  .trow.cur { background: #3E476B; color: #B6B6B6; }
  .trow.cur .nm { color: #B6B6B6; }
  .lblock { background: #313136; border-radius: 4px; margin: 3px 4px; padding: 4px 6px; }
  .lblock .thumbrow { display: flex; gap: 6px; align-items: center; }
  .lblock .lthumb { width: 44px; height: 26px; background: #fff; border: 1px solid #2D2D32; border-radius: 2px; }
  .lblock .minic { display: flex; gap: 4px; color: #898989; font-size: 10px; }
  .lblock .oprow { display: flex; gap: 4px; align-items: center; margin-top: 3px; color: #898989; }
  .lblock .oprow input[type=range] { width: 90px; }
  .dots { display: flex; gap: 3px; margin-top: 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #51565c; display: block; cursor: pointer; }
  .dots i.on { background: #9fd3ef; }
  #tstatus { background: #2D2D32; border-top: 1px solid #2B2B30; display: flex;
    align-items: center; gap: 18px; padding: 2px 10px; font-size: 11px; color: #898989; }
  #tstatus b { color: #B6B6B6; font-weight: 600; }
  .minirow { display: flex; gap: 3px; align-items: center; margin: 2px 4px; }
  .minib { background: #313136; border: 1px solid #2B2B30; border-radius: 3px;
    color: #B6B6B6; padding: 2px 7px; cursor: pointer; font-size: 11px; }
  .minib:hover { background: #3d4249; }

  /* ---- status ---- */
  #statusbar { background: #2D2D32; display: flex; align-items: center; gap: 16px;
    padding: 0 10px; color: #898989; font-size: 11px; }
  #statusbar .right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  #proxyLbl { background: #2f5a43; color: #bfe8d2; border-radius: 3px; padding: 1px 10px; }
  /* current-frame cell: solid blue like TVPaint, above the column tint */
  .cell.curf { background: #3d6fd9 !important; z-index: 6;
    box-shadow: inset 0 0 0 1px #6fa8c9; outline: none; }
  .cell.curf canvas { visibility: hidden; }
  .cell.curf .knum { color: #e8eef5; z-index: 7; }
  .cell.curf .fnum { position: absolute; left: 3px; top: 2px; font-size: 10px;
    color: #fff; z-index: 7; }
  .cell.curf .vsigil { z-index: 7; }
  .cell.curf .dh { z-index: 8; }
</style>
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="workarea">
    <div id="panels"></div>
    <div id="cwrap">
      <div id="viewport">
        <canvas id="art"></canvas>
        <canvas id="ovl"></canvas>
      </div>
    </div>
  </div>
  <div id="tlpanel">
    <div id="tlTransport"></div>
    <div id="tlTabsRow">
      <div id="tlTabs"></div>
      <div id="tlInfoRow"></div>
    </div>
    <div id="tlBody">
      <div id="tlLeft"></div>
      <div id="tlTrack"></div>
    </div>
    <div id="tlFoot" class="tlfoot"></div>
    <div id="tstatus"></div>
  </div>
  <div id="statusbar"></div>
</div>
<script src="engine.js"></script>
<script>window.Engine = { BRUSHES, DRAW_MODES, SHAPES, LAYER_LOOP_MODES, XSHEET_OPS,
  BRUSH_PROFILES, brushDefaults, activateToolBrush, gradientFill,
  newCameraKey, cameraEvaluate, cameraRect, cameraKeyAt, setCameraKey, layerLengthOp,
  resizeProject,
  newProject, newLayer, newFrame, frameSurface, makeSurface, brushStamp,
  strokeBegin, strokeMove, strokeEnd, floodFill, pickColor, xsheetOp, makeHistory,
  serializeProject, deserializeProject, George, colorWithAlpha, effectiveFrameKey };</script>
<script src="ui.js"></script>
</body>
</html>
